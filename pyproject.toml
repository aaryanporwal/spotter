[project]
name = "milemark"
version = "0.1.0"
description = "HOS-aware route planning and daily log generation for property-carrying drivers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django==5.2.6",
    "tzdata>=2026.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "ruff>=0.13",
    "workers-py>=1.16.2",
    "workers-runtime-sdk>=1.6.8",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"backend/worker.py" = ["E402"]
