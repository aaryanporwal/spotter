<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <meta
      name="description"
      content="Plan an HOS-aware truck route and generate daily driver logs."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Milemark — HOS trip planner</title>
    <script>
      (function() {
        try {
          var isDark = localStorage.getItem('milemark-ui-theme') === 'dark' || (!localStorage.getItem('milemark-ui-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
